name: Deploy n8n + Caddy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 📁 Create Deployment Directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /root/n8n-server

      - name: 📤 Copy Files to Server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,Caddyfile,librechat.yaml,couchdb/"
          target: "/root/n8n-server/"

      - name: 🔑 Write .env File
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          LIBRECHAT_ALLOW_REGISTRATION: ${{ secrets.LIBRECHAT_ALLOW_REGISTRATION }}
          LIBRECHAT_CREDS_KEY: ${{ secrets.LIBRECHAT_CREDS_KEY }}
          LIBRECHAT_GOOGLE_KEY: ${{ secrets.LIBRECHAT_GOOGLE_KEY }}
          LIBRECHAT_JWT_REFRESH_SECRET: ${{ secrets.LIBRECHAT_JWT_REFRESH_SECRET }}
          LIBRECHAT_JWT_SECRET: ${{ secrets.LIBRECHAT_JWT_SECRET }}
          LIBRECHAT_MEILI_MASTER_KEY: ${{ secrets.LIBRECHAT_MEILI_MASTER_KEY }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COUCHDB_USER: ${{ secrets.COUCHDB_USER }}
          COUCHDB_PASSWORD: ${{ secrets.COUCHDB_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: LIBRECHAT_ALLOW_REGISTRATION,LIBRECHAT_CREDS_KEY,LIBRECHAT_GOOGLE_KEY,LIBRECHAT_JWT_REFRESH_SECRET,LIBRECHAT_JWT_SECRET,LIBRECHAT_MEILI_MASTER_KEY,N8N_API_KEY,OPENROUTER_API_KEY,COUCHDB_USER,COUCHDB_PASSWORD
          script: |
            cat > /root/n8n-server/.env <<EOF
            LIBRECHAT_ALLOW_REGISTRATION=${LIBRECHAT_ALLOW_REGISTRATION}
            LIBRECHAT_CREDS_KEY=${LIBRECHAT_CREDS_KEY}
            LIBRECHAT_GOOGLE_KEY=${LIBRECHAT_GOOGLE_KEY}
            LIBRECHAT_JWT_REFRESH_SECRET=${LIBRECHAT_JWT_REFRESH_SECRET}
            LIBRECHAT_JWT_SECRET=${LIBRECHAT_JWT_SECRET}
            LIBRECHAT_MEILI_MASTER_KEY=${LIBRECHAT_MEILI_MASTER_KEY}
            N8N_API_KEY=${N8N_API_KEY}
            OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
            COUCHDB_USER=${COUCHDB_USER}
            COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
            EOF
            chmod 600 /root/n8n-server/.env

      - name: 🚀 Start Docker Containers
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/n8n-server

            # Create the data volume if it doesn't exist yet
            docker volume create n8n_data || true

            # Free unused Docker layers before pulling large pinned image updates.
            docker system df
            docker image prune -af
            docker builder prune -af

            # Pull the latest images and start the containers
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af
